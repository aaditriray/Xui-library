<dialog
  #dialog
  class="xui-modal"
  [attr.aria-labelledby]="titleId()"
  (cancel)="handleCancel($event)"
  (click)="dismissFromBackdrop($event)"
>
  <h2 [id]="titleId()">{{ title() }}</h2>
  <ng-content />
  @if (dismissible()) {
    <button type="button" class="xui-modal-close" (click)="dismissed.emit()">Close</button>
  }
</dialog>
